<!doctype html>
<html xmlns:th="http://thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Le Nostre piante</title>
    <th:block th:replace="~{fragments/fragments :: style}"></th:block>
    <style>
      .plant-img {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <th:block th:replace="~{fragments/fragments :: navbar}"></th:block>

    <div class="container mt-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="display-5 fw-bold text-dark">Le nostre piante</h1>
      </div>

      <div class="table-responsive shadow-sm rounded">
        <table class="table table-striped table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th scope="col" style="width: 10%">Foto</th>
              <th scope="col" style="width: 20%">Nome</th>
              <th scope="col" style="width: 50%">Descrizione</th>
              <th scope="col" style="width: 20%">Prezzo</th>
              <th scope="col" style="width: 15%">Azioni</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="plant : ${plants}">
              <td>
                <img
                  th:src="@{'/' + ${plant.imgUrl}}"
                  class="plant-img border shadow-sm"
                  alt="Immagine pianta"
                />
              </td>
              <td>
                <a
                  th:href="@{/plants/{id}(id=${plant.id})}"
                  class="text-decoration-none link-secondary"
                >
                  <strong
                    class="text-secondary"
                    th:text="${plant.name}"
                  ></strong>
                </a>
              </td>
              <td>
                <span class="text-muted" th:text="${plant.description}"></span>
              </td>
              <td class="text-start fw-bold text-success">
                <span th:text="${plant.price} + ' €'"></span>
              </td>

              <td>
                <div class="d-flex gap-1 align-items-center">
                  <a
                    th:href="@{/plants/edit/{id}(id=${plant.id})}"
                    class="btn btn-sm btn-success px-2 py-1"
                  >
                    Modifica
                  </a>

                  <form
                    th:action="@{/plants/delete/{id}(id=${plant.id})}"
                    method="POST"
                    class="m-0"
                    onsubmit="return confirm('Vuoi eliminare questa pianta?');"
                  >
                    <button
                      type="submit"
                      class="btn btn-sm btn-danger px-2 py-1"
                    >
                      Elimina
                    </button>
                  </form>
                </div>
              </td>
            </tr>

            <tr th:if="${plants.isEmpty()}">
              <td colspan="4" class="text-center py-4 text-muted">
                Non ci sono piante disponibili nel menu in questo momento.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
