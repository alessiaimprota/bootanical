<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://thymeleaf.org"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <th:block th:fragment="style">
      <link
        rel="stylesheet"
        th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"
      />
    </th:block>
  </head>
  <body>
    <th:block th:fragment="navbar">
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" th:href="@{/}">
            <img
              th:src="@{/logo.jpg}"
              alt="Bootanical Logo"
              height="40"
              class="d-inline-block align-top"
            />
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" th:href="@{/}"
                  >Home</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" th:href="@{/plants}">Piante</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" th:href="@{/plants/create}"
                  >Aggiungi una nuova pianta</a
                >
              </li>
            </ul>

            <div
              class="d-flex align-items-center gap-3"
              sec:authorize="isAuthenticated()"
            >
              <span class="navbar-text text-dark fw-semibold">
                Benvenuto <span sec:authentication="name">username</span>
              </span>
              <a th:href="@{/logout}" class="btn btn-sm btn-outline-danger">
                <i class="bi bi-box-arrow-right me-1"></i> Logout
              </a>
            </div>

            <div
              class="d-flex align-items-center"
              sec:authorize="!isAuthenticated()"
            >
              <a th:href="@{/login}" class="btn btn-sm btn-success">
                <i class="bi bi-box-arrow-in-right me-1"></i> Login Admin
              </a>
            </div>
          </div>
        </div>
      </nav>
    </th:block>
  </body>
</html>
